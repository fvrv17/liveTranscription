# Боевой профиль площадки: GPU-бокс у звукорежиссёра
talk_id: t_042
title: "Название доклада из расписания"
language: ru               # null => автодетект (рискованно при code-switching)

backend: whisper
model: large-v3
device: cuda
compute_type: float16
beam_size: 1
chunk_sec: 0.8
agreement_n: 2             # 1 => быстрее на ~800 мс, но текст менее стабилен
no_speech_threshold: 0.65

# Словарь конференции. Без него имена, продукты и аббревиатуры
# распознаются позорно — а это ровно те слова, ради которых пришли слушать.
vocabulary:
  - "Anthropic"
  - "Whisper"
  - "LocalAgreement"
  - "диаризация"
  - "инференс"
  - "Мария Петрова"

vad: silero
vad_threshold: 0.5
vad_hangover_sec: 0.6

pause_split_sec: 0.6
max_words: 18
clause_split_words: 12
max_segment_sec: 3.5

# channel — если с пульта идут раздельные каналы (правильный вариант для панели)
# embed   — если есть только суммарный микс
diarize_mode: channel
diarize_channels: {0: "Мария Петрова", 1: "Иван Соколов", 2: "Модератор"}
diarize_enroll_dir: "./enroll"     # 10-секундные wav с саундчека, имя файла = имя спикера
diarize_threshold: 0.68            # косинус ECAPA: свой голос ~0.7-0.8, чужой ~0.2-0.4

# Ниже — только для diarize_mode: embed. Остальные ручки в edge/config.py.
diarize_min_conf: 0.45             # ниже => spk: null. Чужая фамилия хуже пустой подписи
diarize_refine: true               # переразметить доклад в конце и разослать ревизии
diarize_refine_threshold: 0.35     # косинусное РАССТОЯНИЕ остановки кластеризации

cloud_ws: "wss://captions.example.com/ws/ingest"
token: "${INGEST_TOKEN}"
local_stage_port: 8788

# ── многоканальный вход с пульта ────────────────────────────────────────────
# Каналов на входе. >1 включает определение говорящего по каналам: это точнее
# и быстрее любой ML-диаризации и, в отличие от неё, корректно на перебиваниях.
channels: 3
asr_source: dominant       # dominant — канал говорящего (чисто) | mix — сумма

# Пороги в dB ОТНОСИТЕЛЬНО ШУМОВОГО ПОЛА КАНАЛА, не абсолютные: петличка,
# ручной и трибунный микрофоны отличаются по гейну на 10-15 dB.
floor_open_snr: 8.0        # выше пола на столько => канал активен
floor_margin_db: 6.0       # отрыв лидера; меньше => наложение речи
floor_attack_sec: 0.15     # выдержка на переход слова (гасит кашель, стук)
floor_hold_sec: 0.70       # выдержка на отпускание (пауза между словами)
floor_warmup_sec: 1.0      # калибровка пола; в это время в ASR идёт микс
floor_dead_sec: 90.0       # молчит дольше => выключенный микрофон, сигнал оператору
floor_bleed_corr: 0.60     # корреляция огибающих выше => просочка, а не второй голос
