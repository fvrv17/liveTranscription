services:
  cloud:
    build: {context: ., dockerfile: Dockerfile.cloud}
    ports: ["8000:8000"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-token}
      DB_PATH: /data/captions.db
      # Без ключей перевод отключается, саммари собирается извлечением фрагментов
      DEEPL_KEY: ${DEEPL_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE: ${OPENAI_BASE:-https://api.openai.com/v1}
      MT_MODEL: ${MT_MODEL:-gpt-4o-mini}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-4o-mini}
    volumes: ["captions-data:/data"]
    restart: unless-stopped

# Edge-агент запускается НА ПЛОЩАДКЕ, на машине с GPU — не здесь.
# См. edge/config.venue.yaml

volumes:
  captions-data:
